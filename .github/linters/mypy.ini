# mypy config shared by the CI workflow (ci.yml) and Super-Linter.
[mypy]
python_version = 3.12
# The cloud app imports its packages top-level (`from database import ...`),
# so treat LanAtlasv5/cloud/app as an import root.
mypy_path = LanAtlasv5/cloud/app
# Derive module names from the directory layout (LanAtlasv5/agent and the
# cloud app must not collide on top-level names).
explicit_package_bases = True
namespace_packages = True
exclude = ^LanAtlasv5/cloud/tests/
ignore_missing_imports = True
